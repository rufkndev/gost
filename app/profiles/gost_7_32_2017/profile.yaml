# Профиль: ГОСТ 7.32-2017 «Отчёт о научно-исследовательской работе. Структура и правила оформления».
# Источник: docs/source/ГОСТ_7.32-2017.pdf (официальное издание), раздел 6.
#
# Метки источника у каждого значения:
#   [ГОСТ п.] — прямо из стандарта;
#   [SPEC]    — из docs/source/spec.md, стандарт этот параметр не регулирует;
#   [?]       — допущение, ждёт подтверждения владельца (см. docs/GUIDE.md, раздел о профилях).

id: gost_7_32_2017
title: "ГОСТ 7.32-2017"
schema_version: 1

page:
  size: A4                                                  # [ГОСТ 6.1.1]
  margins_mm: {left: 30, right: 15, top: 20, bottom: 20}    # [ГОСТ 6.1.1]
  landscape_margins_mm: {left: 20, right: 20, top: 30, bottom: 15}  # [?] книжные поля, повёрнутые на 90°
  numbering:
    position: bottom_center      # [ГОСТ 6.3.1] в центре нижней части страницы
    trailing_dot: false          # [ГОСТ 6.3.1]
    start_from: 1                # [ГОСТ 6.3.1] сквозная нумерация, включая приложения
    show_on_title: false         # [ГОСТ 6.3.2] титул считается, номер не ставится
    font_pt: 12                  # [SPEC]
  hyphenation: false             # [ГОСТ 6.2.4, 6.5.8] переносы в заголовках и подписях запрещены; [?] выключаем для всего документа

body:
  font: "Times New Roman"        # [ГОСТ 6.1.1] рекомендуемый
  size_pt: 12                    # решение владельца (вопрос 2); ГОСТ 6.1.1: «не менее 12 пт»
  color: "000000"                # [ГОСТ 6.1.1]
  line_spacing: 1.5              # [ГОСТ 6.1.1]
  first_line_indent_cm: 1.25     # [ГОСТ 6.1.1]
  align: justify                 # [SPEC]
  space_before_pt: 0             # [SPEC]
  space_after_pt: 0              # [SPEC]
  widow_control: true            # [SPEC]

headings:
  # Канонические заголовки структурных элементов [ГОСТ 6.2.1].
  structural_names:
    - "СПИСОК ИСПОЛНИТЕЛЕЙ"
    - "РЕФЕРАТ"
    - "СОДЕРЖАНИЕ"
    - "ТЕРМИНЫ И ОПРЕДЕЛЕНИЯ"
    - "ПЕРЕЧЕНЬ СОКРАЩЕНИЙ И ОБОЗНАЧЕНИЙ"
    - "ВВЕДЕНИЕ"
    - "ЗАКЛЮЧЕНИЕ"
    - "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ"
  structural:
    case: upper                  # [ГОСТ 6.2.1]
    align: center                # [ГОСТ 6.2.1]
    bold: true                   # [ГОСТ 6.1.1] полужирный — для заголовков структурных элементов
    underline: false             # [ГОСТ 6.2.1]
    indent: false                # [ГОСТ 6.2.1] «в середине строки»
    new_page: true               # [ГОСТ 6.2.1]
    trailing_dot: false          # [ГОСТ 6.2.1]
    size_pt: 12                  # = кегль основного текста
    line_spacing: 1.5            # [SPEC]
    space_before_pt: 0           # [SPEC]
    space_after_pt: 12           # [SPEC]
  level1:
    case: as_is                  # [ГОСТ 6.2.3] «с прописной буквы» — проверяется, регистр не меняется
    align: left                  # [SPEC] ГОСТ задаёт только абзацный отступ
    bold: true                   # [ГОСТ 6.2.3]
    underline: false             # [ГОСТ 6.2.3]
    indent: true                 # [ГОСТ 6.2.3, 6.4.1]
    new_page: true               # [ГОСТ 6.2.1] каждый раздел с новой страницы
    trailing_dot: false          # [ГОСТ 6.2.3]
    numbering: "{n}"             # [ГОСТ 6.4.1] без точки
    size_pt: 12                  # = кегль основного текста
    line_spacing: 1.5            # [SPEC]
    space_before_pt: 0           # [SPEC]
    space_after_pt: 12           # [SPEC]
  level2:
    case: as_is
    align: left                  # [SPEC]
    bold: true                   # [ГОСТ 6.2.3]
    underline: false             # [ГОСТ 6.2.3]
    indent: true                 # [ГОСТ 6.2.3]
    new_page: false              # [ГОСТ 6.2.1] с новой страницы — только разделы
    trailing_dot: false          # [ГОСТ 6.2.3, 6.4.1]
    numbering: "{n}.{m}"         # [ГОСТ 6.4.1]
    size_pt: 12                  # = кегль основного текста
    line_spacing: 1.5            # [SPEC]
    space_before_pt: 0           # [SPEC]
    space_after_pt: 12           # [SPEC]
  level3:
    case: as_is
    align: left                  # [SPEC]
    bold: true                   # [SPEC] ГОСТ 6.2.2: пункты «как правило, заголовков не имеют»
    underline: false
    indent: true                 # [ГОСТ 6.2.3]
    new_page: false
    trailing_dot: false          # [ГОСТ 6.4.2]
    numbering: "{n}.{m}.{k}"     # [ГОСТ 6.4.2]
    size_pt: 12                  # = кегль основного текста
    line_spacing: 1.5            # [SPEC]
    space_before_pt: 0           # [SPEC]
    space_after_pt: 12           # [SPEC]
  keep_with_next: true           # [SPEC]

figures:
  align: center                  # [?] ГОСТ 6.5.7 задаёт центр только для подписи
  indent: false                  # [?]
  caption:
    position: below              # [ГОСТ 6.5.7]
    align: center                # [ГОСТ 6.5.7]
    indent: false                # [ГОСТ 6.5.7]
    template: "Рисунок {num} — {title}"   # [ГОСТ 6.5.4, 6.5.7] длинное тире, как в стандарте (вопрос 3)
    trailing_dot: false          # [ГОСТ 6.5.7, 6.5.8]
    line_spacing: 1.0            # [ГОСТ 6.5.8] многострочное наименование — через один интервал
    numbering: continuous        # [ГОСТ 6.5.4]
    appendix_number: "{letter}.{n}"  # [ГОСТ 6.5.5] Рисунок А.3

tables:
  caption:
    position: above              # [ГОСТ 6.6.3]
    align: left                  # [ГОСТ 6.6.3]
    indent: false                # [ГОСТ 6.6.3]
    template: "Таблица {num} — {title}"   # [ГОСТ 6.6.3] длинное тире (вопрос 3)
    trailing_dot: false          # [ГОСТ 6.6.3]
    line_spacing: 1.0            # [ГОСТ 6.6.3] две строки и более — через один интервал
    numbering: continuous        # [ГОСТ 6.6.4]
    appendix_number: "{letter}.{n}"  # [ГОСТ 6.6.4] Таблица А.1
  text:
    size_pt: 12                  # [SPEC] ГОСТ 6.6.7: допускается меньше, чем в тексте
    line_spacing: 1.0            # [SPEC]
    first_line_indent_cm: 0      # [?]
  header_row:
    align: center                # [ГОСТ 6.6.6] заголовки граф по центру
    bold: null                   # не регулируется — оставляем как в исходнике
  width: fit_text_area           # [SPEC]
  continuation_label: "Продолжение таблицы {num}"  # [ГОСТ 6.6.3]
  space_after_table_pt: 0        # [SPEC]

notes:
  indent: true                   # [ГОСТ 6.7.2] «Примечание» с абзацного отступа
  single_template: "Примечание — {text}"  # [ГОСТ 6.7.3] только проверка, текст не меняется

formulas:
  align: center                  # [ГОСТ 6.8.3]
  number:
    position: right              # [ГОСТ 6.8.3]
    template: "({num})"          # [ГОСТ 6.8.3]
    numbering: continuous        # [ГОСТ 6.8.3]
    appendix_number: "{letter}.{n}"  # [ГОСТ 6.8.5] (В.1)
  blank_line_around: true        # [ГОСТ 6.8.1] «не менее одной свободной строки»; [?] реализация интервалом стиля
  where_without_colon: check     # [ГОСТ 6.8.2] только проверка в линтере

lists:
  layout: first_line             # [ГОСТ 6.4.6] «с абзацного отступа в столбик»: маркер на 1,25 см, перенос строки к полю
  marker_indent_cm: 1.25         # [ГОСТ 6.4.6]
  bullet_char: "–"               # [ГОСТ 6.4.6] «тире»
  ordered_template: "{n})"       # [ГОСТ 6.4.6]
  lettered_template: "{a})"      # [ГОСТ 6.4.6]
  letters: "абвгдежиклмнпрстуфхцшщэюя"  # [ГОСТ 6.4.6] без ё, з, й, о, ч, ъ, ы, ь

bibliography:
  heading: "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ"  # [ГОСТ 6.2.1]
  numbering: "{n}."              # [ГОСТ 6.16] арабские цифры с точкой
  indent: true                   # [ГОСТ 6.16] с абзацного отступа
  reformat_entries: false        # [SPEC] запись источника не переписывается

appendix:
  heading_template: "ПРИЛОЖЕНИЕ {letter}"  # [ГОСТ 6.17.3, 6.17.4]
  letters: "АБВГДЕЖИКЛМНПРСТУФХЦШЩЭЮЯ"     # [ГОСТ 6.17.4] без Ё, З, Й, О, Ч, Ъ, Ы, Ь
  new_page: true                 # [ГОСТ 6.17.3]
  label: {align: center, bold: true, case: upper}     # [ГОСТ 6.2.1, 6.17.3] строка «ПРИЛОЖЕНИЕ А» в центре вверху
  title: {align: center, bold: true, case: as_is, trailing_dot: false}  # [ГОСТ 6.17.3]

toc:
  generate: auto                 # решение владельца (вопрос 5): было в исходнике ИЛИ > 10 стр. и ≥ 2 заголовков
  title: "СОДЕРЖАНИЕ"            # [ГОСТ 6.2.1]
  levels: 3                      # [SPEC]
  entry_align: left              # [ГОСТ 6.13]
  dot_leader: true               # [ГОСТ 6.13]
  optional_below_pages: 10       # [ГОСТ 5.4.3] при объёме ≤ 10 страниц допускается не составлять

checks:                          # только предупреждения линтера, на выдачу не влияют
  figures_tables_referenced: true   # [ГОСТ 6.5.1, 6.6.2]
  appendices_referenced: true       # [ГОСТ 6.17.2]

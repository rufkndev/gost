name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gost
          POSTGRES_PASSWORD: gost
          POSTGRES_DB: gost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gost" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gost:gost@localhost:5432/gost_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -q
      # Корпус реальных работ в CI не прогоняется: он с ПДн и хранится вне репозитория
      # (запускайте `cli format` по корпусу локально, см. docs/GUIDE.md).
